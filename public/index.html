 finally{catalogBusy=false;$("send").disabled=!catalogLoaded;$("catalog-refresh").disabled=false;}
}

const ptName=a=>{const i=POINTS.indexOf(a);return i>=0?PTL[lang][i]:a};
const trL=k=>t(k);
const dirLbl={fri:"Щучинск → Астана",sun:"Астана → Щучинск"};
function applyLang(){
  document.documentElement.lang=lang==="kz"?"kk":"ru";
  document.title=t("title");$("h1").textContent=t("title");
  document.querySelectorAll("[data-i]").forEach(e=>{
    let s=t(e.dataset.i);if(s===undefined)return;
    s=s.replace("{p1}",PRICE.point.toLocaleString("ru-RU")).replace("{p2}",PRICE.own.toLocaleString("ru-RU"));e.textContent=s});
  document.querySelectorAll("[data-ph]").forEach(e=>e.placeholder=t(e.dataset.ph));
  document.querySelectorAll("#lang button").forEach(b=>b.classList.toggle("on",b.dataset.v===lang));
  fillPoints();
  $("catalog-status").textContent=t(catalogBusy?"catalogLoading":catalogLoaded?"catalogReady":"catalogError");
  $("formTitle").textContent=t(EDIT?"editRec":"newRec");$("send").textContent=t(EDIT?"saveEdit":"save");
  locationPicker.language();price();fillTimes();renderMine();
}
function open(dateStr,time){return Date.now()<deadline(dateStr,st.tr,st.dir,time).getTime()}
function fillDates(){
  const el=$("date"),any=s=>SLOTS[st.dir][st.tr].some(x=>open(s,x));
  el.min=new Date(Date.now()+TZ*3600e3).toISOString().slice(0,10);
  if(!el.value||!any(el.value)){
    const n=new Date(Date.now()+TZ*3600e3);
    for(let i=0;i<120;i++){const s=new Date(Date.UTC(n.getUTCFullYear(),n.getUTCMonth(),n.getUTCDate()+i)).toISOString().slice(0,10);if(any(s)){el.value=s;break}}
  }
  fillTimes();
}
function fillTimes(){
  const sel=$("time"),keep=sel.value;sel.innerHTML="";
  SLOTS[st.dir][st.tr].forEach(x=>{const ok=open($("date").value,x);const o=new Option(x+(ok?"":" — "+t("closed")),x);o.disabled=!ok;sel.add(o)});
  const k=[...sel.options].find(o=>o.value===keep&&!o.disabled)||[...sel.options].find(o=>!o.disabled);if(k)sel.value=k.value;
  renderSelectedDeadline();
}
function renderSelectedDeadline(){
  const date=$("date").value,time=$("time").value;
  if(!date||!time){$("trip-deadline").textContent=t("deadlineSelect");return}
  const limit=deadline(date,"car",st.dir,time),stamp=new Date(limit.getTime()+TZ*3600e3);
  if(!Number.isFinite(limit.getTime())){$("trip-deadline").textContent=t("deadlineSelect");return}
  const full=pad(stamp.getUTCDate())+"."+pad(stamp.getUTCMonth()+1)+"."+stamp.getUTCFullYear()+", "+pad(stamp.getUTCHours())+":"+pad(stamp.getUTCMinutes());
  $("trip-deadline").textContent=t(Date.now()>=limit.getTime()?"deadlineClosed":"deadlineUntil")+full+t("deadlineZone");
}
function showParentPage(id){if(window.RazvozkaParentNavigation)window.RazvozkaParentNavigation.show(id)}
function mark(){
 $("from-city").value=st.dir==="fri"?"shchuchinsk":"astana";$("to-city").value=toCity();
 for(const o of $("to-city").options)o.disabled=o.value===$("from-city").value;
}
function price(){
  const own=$("pt").value==="own";$("ownBox").hidden=!own;
  $("price").textContent=t("cost")+(own?PRICE.own:PRICE.point).toLocaleString("ru-RU")+t("tg");
}
$("from-city").onchange=()=>{
 if($("from-city").value===$("to-city").value)$("to-city").value=$("from-city").value==="astana"?"shchuchinsk":"astana";
 changeCities();
};
$("to-city").onchange=changeCities;
function changeCities(){try{st.dir=RazvozkaTripCatalog.direction($("from-city").value,$("to-city").value);mark();fillPoints();fillDates();}catch(e){msg(t("eCities"),"err");}}
$("catalog-refresh").onclick=loadCatalog;
$("pt").onchange=price;$("date").onchange=fillTimes;$("time").onchange=renderSelectedDeadline;
//MASK-START
function maskPhone(v){
  let d=String(v).replace(/\D/g,"");
  if(d.length>10&&(d[0]==="7"||d[0]==="8"))d=d.slice(1);
  d=d.slice(0,10);
  let s=d?"("+d.slice(0,3):"";
  if(d.length>3)s+=") "+d.slice(3,6);
  if(d.length>6)s+=" "+d.slice(6,8);
  if(d.length>8)s+=" "+d.slice(8,10);
  return s;
}
//MASK-END
$("phone").oninput=e=>{e.target.value=maskPhone(e.target.value)};
$("lang").onclick=e=>{const b=e.target.closest("button");if(!b)return;lang=b.dataset.v;try{localStorage.setItem("lang",lang)}catch(x){}applyLang()};

let EDIT=null,MINE=[],AUTH=null,CONFIRM="";
const CFG=window.CFG||{};
async function rpc(fn,args){
  let r;try{r=await fetch(CFG.URL+"/rest/v1/rpc/"+fn,{method:"POST",headers:{apikey:CFG.KEY,Authorization:"Bearer "+CFG.KEY,"Content-Type":"application/json"},body:JSON.stringify(args)})}catch(e){throw new Error("net")}
  const j=await r.json().catch(()=>({}));
  if(!r.ok)throw new Error("net");
  if(j&&j.error)throw new Error(j.error);
  return j;
}
const ERR={bad_cities:"eCities",bad_pin:"ePin",pin_wrong:"ePinWrong",locked:"eLocked",closed:"eClosed",locked_rec:"eExp",addr:"eAddr",car_only:"archive",bad_location:"eLocation",bad_data:"eName",bad_phone:"ePhone",net:"eNet"};
const errText=e=>ERR[e.message]?t(ERR[e.message]):t("eSave")+e.message;
const digits=v=>String(v).replace(/\D/g,"");
const msg=(s,c)=>{$("msg").innerHTML="";const d=document.createElement("div");d.className=c;d.textContent=s;$("msg").append(d);$("parent-feedback").hidden=c!=="ok"||!s;$("parent-feedback").textContent=c==="ok"?s:""};
$("mPhone").oninput=e=>{e.target.value=maskPhone(e.target.value)};
$("send").onclick=async()=>{
 if(saving||catalogBusy||checkingDeadline)return;
 if(!catalogLoaded)return msg(t("catalogError"),"err");
 checkingDeadline=true;try{readDeadlines(await rpc("trip_catalog",{}));renderSelectedDeadline();}catch(e){showParentPage("form");return msg(t("catalogError"),"err");}finally{checkingDeadline=false;}
 try{st.dir=RazvozkaTripCatalog.direction($("from-city").value,$("to-city").value);}catch(e){return msg(t("eCities"),"err");}
  const name=$("name").value.trim().replace(/\s+/g," "),phone=$("phone").value.trim(),pin=$("pin").value,date=$("date").value,time=$("time").value;
  if(name.split(" ").length<2)return msg(t("eName"),"err");
  if(digits(phone).length!==10)return msg(t("ePhone"),"err");
  if(!/^\d{4}$/.test(pin))return msg(t("ePin"),"err");
  if(!date||!time||!open(date,time))return msg(t("eClosed"),"err");
  let point_id=null,addr="",pr=0,delivery_lat=null,delivery_lon=null,delivery_note="";
  if($("pt").value==="own"){
    if(toCity()!=="astana")return msg(t("ownAstana"),"err");
    const point=locationPicker.value();if(!point)return msg(t("eLocation"),"err");
    delivery_lat=point.lat;delivery_lon=point.lon;delivery_note=$("delivery-note").value.trim();pr=PRICE.own;
  }else{const point=CATALOG_POINTS.find(p=>p.id===$("pt").value&&p.city===toCity());if(!point)return msg(t("eAddr"),"err");point_id=point.id;addr=point.address;pr=PRICE.point}
  if(EDIT&&Date.now()>=deadline(EDIT.date,EDIT.tr,EDIT.dir,EDIT.time).getTime())return msg(t("eExp"),"err");
  const editing=!!EDIT;
  saving=true;$("send").disabled=true;
  try{
    await rpc("upsert_signup",{p_id:editing?EDIT.id:null,p_phone:digits(phone),p_pin:pin,p_data:{from_city:$("from-city").value,to_city:$("to-city").value,point_id,dir:st.dir,tr:st.tr,date,time,name,cls:$("num").value+$("let").value,addr,delivery_lat,delivery_lon,delivery_note}});
    msg(t(editing?"changed":"done")+name+", "+fmt(date)+t("at")+time+", "+trL(st.tr)+(pr?", "+pr+t("tg"):""),"ok");
    if(editing)exitEdit();
    $("name").value="";$("mPhone").value=maskPhone(phone);$("mPin").value=pin;await loadMine();showParentPage("mine");
  }catch(e){msg(errText(e),"err");showParentPage("form")}
  saving=false;$("send").disabled=!catalogLoaded;
};
async function loadMine(){
  const p=digits($("mPhone").value),pin=$("mPin").value;
  if(p.length!==10||!/^\d{4}$/.test(pin)){$("mineMsg").textContent=t("eAuth");return}
  try{const j=await rpc("my_signups",{p_phone:p,p_pin:pin});AUTH={phone:p,pin};MINE=j.rows||[];renderMine();$("mineMsg").textContent=MINE.length?"":t("none")}
  catch(e){MINE=[];AUTH=null;renderMine();$("mineMsg").textContent=errText(e)}
}
$("find").onclick=loadMine;
function exitEdit(){EDIT=null;$("formTitle").textContent=t("newRec");$("send").textContent=t("save");$("cancelEdit").hidden=true;$("name").value="";locationPicker.set(null);$("delivery-note").value=""}
$("cancelEdit").onclick=()=>{exitEdit();msg("","")};
function startEdit(r){
  if(!catalogLoaded){showParentPage("form");msg(t("catalogError"),"err");return;}
  showParentPage("form");
  EDIT=r;st.dir=r.dir;st.tr="car";mark();fillDates();
  $("date").value=r.date;fillTimes();$("time").value=r.time;
  fillPoints();const point=CATALOG_POINTS.find(p=>p.city===toCity()&&(r.point_id?p.id===r.point_id:p.address===r.addr));const own=!point;$("pt").value=own?"own":point.id;locationPicker.set(own?{lat:r.delivery_lat,lon:r.delivery_lon}:null);$("delivery-note").value=r.delivery_note||"";price();
  $("name").value=r.name;$("num").value=r.cls.slice(0,-1);$("let").value=r.cls.slice(-1);
  $("phone").value=maskPhone(AUTH.phone);$("pin").value=AUTH.pin;
  $("formTitle").textContent=t("editRec");$("send").textContent=t("saveEdit");$("cancelEdit").hidden=false;msg("","");
  renderSelectedDeadline();
}
function renderMine(){
  const box=$("mineList");box.innerHTML="";
  MINE.slice().sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time)).forEach(r=>{
    const can=r.tr==="car"&&Date.now()<(r.deadline?new Date(r.deadline):deadline(r.date,r.tr,r.dir,r.time)).getTime();
    const d=document.createElement("div");d.style.cssText="border-top:1px solid var(--b);padding:10px 0";
    const h=document.createElement("b");h.textContent=r.name+" ("+r.cls+")";
    const s=document.createElement("div");s.className="m";
    s.textContent=(r.tr==="car"?trL("car"):t("archive"))+" · "+dirLbl[r.dir]+" · "+fmt(r.date)+" "+r.time+(r.tr==="car"?" · "+ptName(r.addr)+" · "+r.price+t("tg"):"");
    d.append(h,s);
    if(r.tr==="car"){
      const info=document.createElement("div");info.className="parent-deadline";
      if(r.driver){const title=document.createElement("strong");title.textContent=t("driverTitle")+": "+r.driver.name;const phone=document.createElement("p");phone.textContent=t("driverPhone")+r.driver.phone;const kaspi=document.createElement("p");kaspi.textContent=t("driverKaspi")+r.driver.kaspi;info.append(title,phone,kaspi);}
      else info.textContent=t("driverPending");d.append(info);
    }
    if(can){
      const e=document.createElement("button");e.className="sm";e.textContent=t("edit");e.onclick=()=>startEdit(r);
      const x=document.createElement("button");x.className="sm";x.textContent=CONFIRM===r.id?t("sure"):t("cancel");
      x.onclick=async()=>{
        if(CONFIRM!==r.id){CONFIRM=r.id;renderMine();return}
        CONFIRM="";
        try{await rpc("cancel_signup",{p_id:r.id,p_phone:AUTH.phone,p_pin:AUTH.pin});if(EDIT&&EDIT.id===r.id)exitEdit()}catch(err){$("mineMsg").textContent=errText(err)}
        loadMine();
      };
      d.append(e,x);
    }else{const l=document.createElement("div");l.className="m";l.textContent=r.tr==="car"?t("locked")+dateTime((r.deadline?new Date(r.deadline):deadline(r.date,r.tr,r.dir,r.time)))+")":t("archive");d.append(l)}
    box.append(d);
  });
}
const locationPicker=RazvozkaLocation.mount(document,()=>lang,CFG);
mark();applyLang();fillDates();
const catalogReady=loadCatalog();
</script></body></html>
